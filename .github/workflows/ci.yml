name: CI Pipeline

on:
  push:

jobs:
  systeminfo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Script Executable
        run: chmod +x systeminfo.sh

      - name: Run System Info Script
        run: ./systeminfo.sh

      - name: Success Message
        run: echo "Week 3 CI Successful"
